<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>
<link rel="stylesheet" href="todo-app.css">
</head>
<body>
<main class="app">
<h1>My Tasks</h1>
<form id="form">
<input id="text" type="text" placeholder="Add a task" aria-label="New task" required>
<button type="submit">Add</button>
</form>
<ul id="list"></ul>
<p id="count"></p>
</main>
<script src="todo-app.js"></script>
</body>
</html>
